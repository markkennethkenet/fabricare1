name: fabricare
description: "FabriCare — Smart Fabric Care mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  intl: ^0.19.0
  image: ^4.1.3
  http: ^1.2.0
  shared_preferences: ^2.3.3
  path: ^1.9.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    # Old on-device TFLite model — replaced by GLCM API (fabric_glcm_decision_tree.pkl)
    # - assets/fabric_classifier.tflite
    # - assets/labels.txt
    - assets/images/